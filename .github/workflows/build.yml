name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=SuperRouter, OU=Dev, O=DyTool, L=CN, ST=CN, C=CN"

      - name: 编译 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DyTool-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 读取版本号
        id: ver
        run: |
          echo "TAG=v1.0.$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: 抖音工具箱 ${{ steps.ver.outputs.TAG }}
          body: |
            抖音工具箱 自动构建

            支持：视频下载 / 音频提取 / 封面下载
            最低系统：Android 8.1 (API 27)
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false