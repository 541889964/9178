name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true
      - name: Verify RingtoneHelper
        run: |
          echo "════════ RingtoneHelper 内容 ════════"
          cat app/src/main/java/com/xuanyin/app/util/RingtoneHelper.java
          echo ""
          echo "════════ 大小 ════════"
          wc -c app/src/main/java/com/xuanyin/app/util/RingtoneHelper.java
      - name: Build APK
        run: gradle assembleRelease --no-daemon --no-build-cache --rerun-tasks
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LanShare-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
      - if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
