name: Build XuanYin
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          log-accepted-android-sdk-licenses: false

      - run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --parallel --max-workers=16 --build-cache --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanyin-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v36-${{ github.run_number }}
          name: 玄音 v36.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
